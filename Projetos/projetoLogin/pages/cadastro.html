CADASTRO.HTML
 
<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <!-- ================ REMIXICON ========================= -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
 
    <!-- ================ CSS ========================= -->
    <link rel="stylesheet" href="../assets/css/login.css">
 
    <!-- ================ LOGIN JS ========================= -->
    <script src="../assets/js/mostrarSenha.js" defer></script>
 
    <title>Cadastro</title>
</head>
 
<body>
    <!-- criar a tag main com a classe login -->
    <main class="login">
 
        <!-- colocar uma imagem com a tag correspondente use a classe login__img -->
        <img src="../assets/image/cadastro-bg.jpg" alt="" class="login__img">
 
        <!-- criar um formulario com a class login__form -->
        <form class="login__form">
 
            <h1 class="login__title">Cadastro</h1>
 
            <div class="login__content">
 
                <div class="login__box">
 
                    <i class="ri-user-3-line login__icon"></i>
 
                    <div class="login__box-input">
                        <input type="email" id="cadastro-email" class="login__input" required placeholder="">
 
                        <label for="login-email" class="login__label">E-mail</label>
                    </div>
 
                </div>
 
                <div class="login__box">
 
                    <i class="ri-lock-2-line login__icon"></i>
 
                    <div class="login__box-input">
                        <input type="password" id="login-pass" class="login__input" required placeholder="">
 
                        <label for="login-pass" class="login__label">Password</label>
                    </div>
 
                    <i class="ri-eye-off-line login__eye" id="login-eye"></i>
                </div>
 
                <div class="login__box">
 
                    <i class="ri-lock-2-line login__icon"></i>
 
                    <div class="login__box-input">
                        <input type="password" id="cadastro-pass-confirm" class="login__input" required placeholder="">
 
                        <label for="cadastro-pass-confirm" class="login__label">Repeat Password</label>
 
                    </div>
                    <i class="ri-eye-off-line login__eye" id="login-eye-confirm"></i>
                   
 
                </div>
 
                <button type="submit" class="login__button">Register</button>
 
                <p class="login__register">
                    have an account?
                    <a href="../index.html">Login</a>
                </p>
 
            </div>
        </form>
 
    </main>
 
</body>
 
</html>

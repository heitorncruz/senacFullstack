<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <h1>Faça seu cadastro</h1>
    <form>
        <h1>Cadastrar</h1>
        <label for="cadastroUsuario">Usuário</label>
        <br>
        <input type="" id="cadastroUsuario">
        
        <br><br>

        <label for="cadastroSenha">Senha </label>
        <br>
        <input type="password" id="cadastroSenha">

        <br><br>

        <label for="senhaConfirmacao">Confirmar senha</label>
        <br>
        <input type="password" id="senhaConfirmacao">

        <br><br>
        
        <input type="checkbox" id="checkExibirSenha">
        <label for="checkExibirSenha">Exibir senha</label>

        <button type="submit">Cadastrar</button>

        <p>Possui uma conta</p>

        <a href="login.html">Entrar no sistema</a>
        
    </form>

</body>
</html>

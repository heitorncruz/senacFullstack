<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>

    <form>
        <h1>Login</h1>
        <label for="nomeUsuario">Digite seu usuário</label>
        <br>
        <input type="" id="nomeUsuario">
        
        <br><br>

        <label for="senhaLogin">Digite sua senha</label>
        <br>
        <input type="password" id="senhaLogin">

        <br><br>

        <input type="checkbox" id="checkExibirSenha">
        <label for="checkExibirSenha">Exibir senha</label>

        <br><br>

        <button type="submit">Entrar</button>

        <p>Não possui uma conta</p>

        <a href="cadastro.html">Criar nova conta</a>
        
    </form>
    
</body>
</html>
